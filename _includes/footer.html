  <div class="footer-pac" role="button" tabindex="0" aria-label="Play Pac-Man" title="Click to play Pac-Man!">
    <img class="pac" src="{{ '/assets/img/pacman.svg' | relative_url }}" alt="">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>

  <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.username }} — crafted in the terminal</p>
