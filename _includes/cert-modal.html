<div id="cert-modal" class="cert-modal" hidden aria-hidden="true" role="dialog" aria-label="Certification detail">
  <div class="cert-modal-stage">
    <button id="cert-close" class="cert-close" aria-label="Close">&#10005;</button>

    <div id="cert-flip" class="flip-card" role="button" tabindex="0" aria-label="Flip card">
      <div class="flip-inner">
        <div class="flip-face flip-front">
          <div class="flip-badge"><img id="cert-m-img" src="" alt=""></div>
          <h3 id="cert-m-name" class="glitch"></h3>
          <span class="flip-hint">click to flip &#8635;</span>
        </div>

        <div class="flip-face flip-back">
          <p class="cert-m-kicker">// credential</p>
          <h3 id="cert-m-name-back" class="glitch"></h3>
          <p id="cert-m-issuer" class="cert-m-issuer"></p>
          <p id="cert-m-summary" class="cert-m-summary"></p>
          <div id="cert-m-links" class="cert-m-links"></div>
          <span class="flip-hint">&#8635; flip back</span>
        </div>
      </div>
    </div>
  </div>
</div>
