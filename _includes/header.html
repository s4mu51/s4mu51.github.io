<header id="hero">
  <div id="particles-js"></div>

  <div class="hero-inner">
    <p class="hero-prompt">
      <span class="c-accent">root@localhost</span> $ <span class="typed">whoami</span><span class="caret"></span>
    </p>

    <h1 class="glitch" data-text="{{ site.username }}">{{ site.username }}</h1>

    <p class="hero-role">{{ site.user_title }}</p>

    <ul class="socials">
      <li><a class="social" aria-label="LinkedIn" target="_blank" rel="noopener" href="{{ site.linkedin_username }}"><img src="{{ '/assets/img/linkedin.svg' | relative_url }}" alt="LinkedIn"></a></li>
      <li><a class="social" aria-label="GitHub" target="_blank" rel="noopener" href="{{ site.github_username }}"><img src="{{ '/assets/img/github.svg' | relative_url }}" alt="GitHub"></a></li>
      <li><a class="social" aria-label="Hack The Box" target="_blank" rel="noopener" href="{{ site.htb_username }}"><img src="{{ '/assets/img/htb.svg' | relative_url }}" alt="Hack The Box"></a></li>
      <li><a class="social" aria-label="TryHackMe" target="_blank" rel="noopener" href="{{ site.thm_username }}"><img src="{{ '/assets/img/thm.svg' | relative_url }}" alt="TryHackMe"></a></li>
      <li><a class="social" aria-label="Yogosha" target="_blank" rel="noopener" href="{{ site.yogosha_username }}"><img src="{{ '/assets/img/yogosha.png' | relative_url }}" alt="Yogosha"></a></li>
    </ul>
  </div>

  <a class="scroll-cue" href="#certifications" data-scroll aria-label="Scroll to content"><span></span></a>
</header>
